name: Update Yeongjong 2027 General Recruitment

on:
  schedule:
    # Runs daily at 03:00 UTC = 12:00 PM KST (Asia/Seoul)
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-general-2027
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF text extractor
        run: pip install --quiet pypdf

      - name: Scan Yeongjong kindergartens & update viewer
        run: python scripts/update_general_2027.py --write-status

      - name: Commit & push updates if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yeongjong-2027-docs/ yeongjong_2027_originals_viewer.html
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-update 2027 general recruitment status ($(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST'))"
            for attempt in 1 2 3; do
              if git pull --rebase -X theirs origin main && git push origin main; then
                echo "Pushed successfully on attempt ${attempt}."
                exit 0
              fi
              echo "Attempt ${attempt} failed; retrying in 5s..."
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
            echo "Failed to push after 3 attempts."
            exit 1
          else
            echo "No changes detected."
          fi
